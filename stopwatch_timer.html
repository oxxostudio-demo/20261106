<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>碼表計時器</title>
  <style>
    :root {
      --bg: #071321;
      --panel: #102438;
      --panel-2: #0b1c2d;
      --cyan: #39d9ed;
      --blue: #438cff;
      --text: #effaff;
      --muted: #8ba8bc;
      --line: rgba(91, 196, 224, .18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 28px 16px; color: var(--text);
      font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at 50% 20%, rgba(42, 128, 180, .22), transparent 34%),
        linear-gradient(145deg, #06111e, #0a1b2b 58%, #071321);
    }
    .app { width: min(100%, 480px); }
    header { text-align: center; margin-bottom: 28px; }
    .eyebrow { color: var(--cyan); font-size: 11px; letter-spacing: .28em; font-weight: 800; }
    h1 { margin: 9px 0 7px; font-size: clamp(27px, 6vw, 36px); letter-spacing: .08em; }
    .subtitle { margin: 0; color: var(--muted); font-size: 13px; letter-spacing: .08em; }
    .timer-card {
      position: relative; overflow: hidden; padding: 30px 22px 26px;
      border: 1px solid var(--line); border-radius: 28px;
      background: linear-gradient(155deg, rgba(18, 43, 64, .96), rgba(9, 27, 43, .98));
      box-shadow: 0 24px 70px rgba(0,0,0,.34), inset 0 1px rgba(255,255,255,.04);
    }
    .timer-card::before {
      content: ""; position: absolute; width: 260px; height: 260px; border-radius: 50%;
      top: -170px; right: -100px; background: rgba(57,217,237,.09); filter: blur(4px);
    }
    .status { display: flex; justify-content: center; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; letter-spacing: .2em; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #64798b; }
    .running .status-dot { background: var(--cyan); box-shadow: 0 0 12px var(--cyan); animation: pulse 1.2s infinite; }
    .dial-wrap { width: min(76vw, 310px); aspect-ratio: 1; margin: 24px auto 22px; position: relative; display: grid; place-items: center; }
    .dial {
      position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from -90deg, var(--cyan) var(--progress, 0%), rgba(80,151,180,.12) 0);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px));
      filter: drop-shadow(0 0 8px rgba(57,217,237,.35));
    }
    .dial-inner {
      position: absolute; inset: 15px; border-radius: 50%;
      border: 1px solid rgba(91,196,224,.13);
      background: radial-gradient(circle, rgba(29,68,91,.5), rgba(7,23,38,.92) 68%);
    }
    .ticks { position: absolute; inset: 5px; border-radius: 50%; }
    .ticks span { position: absolute; left: 50%; top: 0; width: 2px; height: 8px; border-radius: 2px; background: rgba(132,192,212,.55); transform-origin: 50% 150px; }
    .readout { position: relative; z-index: 1; text-align: center; }
    .time { font-variant-numeric: tabular-nums; font-size: clamp(37px, 10vw, 52px); font-weight: 700; letter-spacing: -.045em; text-shadow: 0 0 22px rgba(57,217,237,.17); }
    .time small { font-size: .48em; color: var(--cyan); letter-spacing: 0; }
    .time-label { margin-top: 9px; color: var(--muted); font-size: 10px; letter-spacing: .3em; }
    .hand {
      position: absolute; z-index: 2; left: 50%; top: 50%; width: 2px; height: 77px;
      background: linear-gradient(var(--cyan), transparent); transform-origin: 50% 100%;
      transform: translate(-50%, -100%) rotate(0deg); border-radius: 4px;
      filter: drop-shadow(0 0 5px var(--cyan)); pointer-events: none;
    }
    .hub { position: absolute; z-index: 3; width: 9px; height: 9px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
    .actions { display: flex; justify-content: center; gap: 12px; margin-top: 8px; }
    button {
      min-width: 128px; border: 0; border-radius: 13px; padding: 14px 22px;
      color: #061522; background: linear-gradient(120deg, var(--cyan), #62b8ff);
      font: inherit; font-size: 14px; font-weight: 800; letter-spacing: .08em;
      cursor: pointer; transition: transform .18s, filter .18s, opacity .18s;
      box-shadow: 0 8px 22px rgba(45,190,220,.18);
    }
    button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.08); }
    button:active:not(:disabled) { transform: translateY(0); }
    button.secondary {
      color: #b9d1df; background: #183247; border: 1px solid rgba(113,183,207,.18);
      box-shadow: none;
    }
    button:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
    .hint { text-align: center; color: #66869b; font-size: 11px; margin: 20px 0 0; letter-spacing: .06em; }
    footer { text-align: center; margin-top: 18px; color: #557287; font-size: 10px; letter-spacing: .18em; }
    @keyframes pulse { 50% { opacity: .45; } }
    @media (max-width: 380px) {
      .timer-card { padding: 24px 14px; }
      button { min-width: 0; flex: 1; padding: 13px 12px; }
      .actions { gap: 9px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow">PRECISION TIMEKEEPER</div>
      <h1>碼表計時器</h1>
      <p class="subtitle">專注每一秒，掌握你的節奏</p>
    </header>

    <section class="timer-card" id="timerCard" aria-label="碼表">
      <div class="status"><span class="status-dot"></span><span id="statusText">READY TO START</span></div>
      <div class="dial-wrap">
        <div class="dial-inner"></div>
        <div class="ticks" id="ticks"></div>
        <div class="dial" id="dial"></div>
        <div class="hand" id="hand"></div>
        <div class="hub"></div>
        <div class="readout">
          <div class="time"><span id="minutes">00</span>:<span id="seconds">00</span><small id="centiseconds">.00</small></div>
          <div class="time-label">MIN　:　SEC　:　MS</div>
        </div>
      </div>
      <div class="actions">
        <button id="startPause" type="button">開始</button>
        <button id="reset" class="secondary" type="button" disabled>重設</button>
      </div>
      <p class="hint" id="hint">按下「開始」啟動計時</p>
    </section>
    <footer>DESIGNED FOR FOCUS · BUILT FOR EVERY SECOND</footer>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const startPause = $("startPause"), reset = $("reset");
    const card = $("timerCard");
    let elapsed = 0, startedAt = 0, raf = null, running = false;

    // 刻度線
    for (let i = 0; i < 60; i++) {
      const tick = document.createElement("span");
      tick.style.transform = `rotate(${i * 6}deg)`;
      tick.style.opacity = i % 5 === 0 ? "1" : ".45";
      tick.style.height = i % 5 === 0 ? "11px" : "6px";
      $("ticks").appendChild(tick);
    }

    function format(ms) {
      const total = Math.floor(ms / 10);
      return {
        minutes: String(Math.floor(total / 6000)).padStart(2, "0"),
        seconds: String(Math.floor(total / 100) % 60).padStart(2, "0"),
        centiseconds: String(total % 100).padStart(2, "0")
      };
    }
    function render() {
      const t = format(elapsed);
      $("minutes").textContent = t.minutes;
      $("seconds").textContent = t.seconds;
      $("centiseconds").textContent = "." + t.centiseconds;
      $("dial").style.setProperty("--progress", `${(elapsed % 60000) / 60000 * 100}%`);
      $("hand").style.transform = `translate(-50%, -100%) rotate(${(elapsed % 60000) / 1000 * 6}deg)`;
    }
    function frame(now) {
      if (!running) return;
      elapsed = now - startedAt;
      render();
      raf = requestAnimationFrame(frame);
    }
    function start() {
      running = true;
      startedAt = performance.now() - elapsed;
      card.classList.add("running");
      $("statusText").textContent = "TIME IS RUNNING";
      $("hint").textContent = "計時中 · 再按一次即可暫停";
      startPause.textContent = "暫停";
      reset.disabled = false;
      raf = requestAnimationFrame(frame);
    }
    function pause() {
      running = false;
      cancelAnimationFrame(raf);
      card.classList.remove("running");
      $("statusText").textContent = "PAUSED";
      $("hint").textContent = "時間已暫停，按「繼續」恢復計時";
      startPause.textContent = "繼續";
    }
    function resetTimer() {
      running = false;
      cancelAnimationFrame(raf);
      elapsed = 0;
      card.classList.remove("running");
      $("statusText").textContent = "READY TO START";
      $("hint").textContent = "按下「開始」啟動計時";
      startPause.textContent = "開始";
      reset.disabled = true;
      render();
    }
    startPause.addEventListener("click", () => running ? pause() : start());
    reset.addEventListener("click", resetTimer);
    render();
  </script>
</body>
</html>
